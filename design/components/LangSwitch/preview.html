<!-- @dsCard group="Navigazione" height=240 subtitle="Header, foglio e footer; la lingua corrente è sottolineata e in grassetto" -->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>LangSwitch — anteprima</title>
<link rel="stylesheet" href="../../components/bundle.css">
<link rel="stylesheet" href="../../components/preview.css">
</head>
<body>
<div class="dc-stage">

  <div class="dc-stage__item">
    <span class="dc-stage__label">Header · 15 px, corrente IT</span>
    <nav aria-label="Lingua">
      <ul class="dc-lang">
        <li><a href="/" lang="it" hreflang="it" aria-current="page">IT</a></li>
        <li class="dc-lang__sep" aria-hidden="true">·</li>
        <li><a href="/en/" lang="en" hreflang="en">EN</a></li>
        <li class="dc-lang__sep" aria-hidden="true">·</li>
        <li><a href="/de/" lang="de" hreflang="de">DE</a></li>
      </ul>
    </nav>
  </div>

  <div class="dc-stage__item">
    <span class="dc-stage__label">Foglio · 18 px con etichetta, corrente EN</span>
    <nav aria-label="Language" lang="en">
      <ul class="dc-lang dc-lang--sheet">
        <li class="dc-lang__label">Language</li>
        <li><a href="/ordini/" lang="it" hreflang="it">IT</a></li>
        <li class="dc-lang__sep" aria-hidden="true">·</li>
        <li><a href="/en/orders/" lang="en" hreflang="en" aria-current="page">EN</a></li>
        <li class="dc-lang__sep" aria-hidden="true">·</li>
        <li><a href="/de/bestellen/" lang="de" hreflang="de">DE</a></li>
      </ul>
    </nav>
  </div>

  <div class="dc-stage__item">
    <span class="dc-stage__label">Footer · 15 px con etichetta, corrente DE</span>
    <nav aria-label="Sprache" lang="de">
      <ul class="dc-lang">
        <li class="dc-lang__label">Sprache</li>
        <li><a href="/dove-siamo/" lang="it" hreflang="it">IT</a></li>
        <li class="dc-lang__sep" aria-hidden="true">·</li>
        <li><a href="/en/find-us/" lang="en" hreflang="en">EN</a></li>
        <li class="dc-lang__sep" aria-hidden="true">·</li>
        <li><a href="/de/anfahrt/" lang="de" hreflang="de" aria-current="page">DE</a></li>
      </ul>
    </nav>
  </div>

</div>
</body>
</html>
