<!-- @dsCard group="Contenuti" height=420 width=1180 subtitle="3:2 per hero e timeline, 4:3 per le card, d'epoca in bianco e nero con didascalia e anno; il segnaposto quando la foto manca" -->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Figure — anteprima</title>
<link rel="stylesheet" href="../../components/bundle.css">
<link rel="stylesheet" href="../../components/preview.css">
</head>
<body>
<div class="dc-stage">

  <div class="dc-stage__item" style="width: 360px; max-width: 100%">
    <span class="dc-stage__label">3:2 · hero e Dove siamo</span>
    <figure class="dc-figure dc-figure--3x2">
      <img src="/_blob/39f27d42a2a2b4b93d9a4ef38aa99913" alt="Il banco con cornetti, pizzette rosse e focacce dietro il vetro" width="600" height="400" fetchpriority="high">
      <figcaption>Il banco di mattina</figcaption>
    </figure>
  </div>

  <div class="dc-stage__item" style="width: 300px; max-width: 100%">
    <span class="dc-stage__label">4:3 · card e colonne</span>
    <figure class="dc-figure dc-figure--4x3">
      <img src="/_blob/548f3630797215ff3bab350fc928912a" alt="Pagnotte di pane di giornata nella cesta" width="800" height="600" loading="lazy">
      <figcaption>Pane di giornata, al chilo</figcaption>
    </figure>
  </div>

  <div class="dc-stage__item" style="width: 360px; max-width: 100%">
    <span class="dc-stage__label">D'epoca · bianco e nero nel file, con anno</span>
    <figure class="dc-figure dc-figure--3x2 dc-figure--vintage">
      <img src="/_blob/4bb5d9f7434737f0482d71e2271b766e" alt="L'insegna in legno «Fornaio F.lli De Conca» sopra la porta del negozio" width="900" height="600" loading="lazy">
      <figcaption>L'insegna «Fornaio F.lli De Conca» sul lungomare, <em class="dc-placeholder">[[ANNO]]</em></figcaption>
    </figure>
  </div>

  <div class="dc-stage__item" style="width: 300px; max-width: 100%">
    <span class="dc-stage__label">Segnaposto · foto ancora da scattare</span>
    <figure class="dc-figure dc-figure--3x2">
      <div class="dc-figure__placeholder">Foto 24 — lungomare con la base, 3:2</div>
      <figcaption>Il lungomare Caboto visto dal negozio</figcaption>
    </figure>
  </div>

</div>
</body>
</html>
